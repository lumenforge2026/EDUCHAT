version: "3.8"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-edubot}
      POSTGRES_PASSWORD: ${PGPASSWORD:-edubot}
      POSTGRES_DB: ${PGDATABASE:-edubot}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-edubot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-changeme}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres

  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    ports:
      - "${WAHA_PORT:-3001}:3000"
    environment:
      - WHATSAPP_API_KEY=${WAHA_API_KEY:-changeme}
      - WHATSAPP_HOOK_URL=${WAHA_HOOK_URL:-http://n8n:5678/webhook/waha}
      - WHATSAPP_HOOK_EVENTS=message,message.any
    volumes:
      - waha_data:/app/.sessions
    depends_on:
      - n8n

volumes:
  postgres_data:
  n8n_data:
  waha_data:
